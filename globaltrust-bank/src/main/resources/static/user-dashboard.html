<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .balance-card {
            background: linear-gradient(135deg, rgba(212, 168, 83, 0.2), rgba(26, 39, 68, 0.8));
            border-left: 4px solid var(--accent);
        }
        .quick-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .chart-container {
            margin-top: 2rem;
            padding: 1.5rem;
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GlobalTrust</div>
            <nav>
                <a href="user-dashboard.html" class="nav-link active">Dashboard</a>
                <a href="transactions.html" class="nav-link">Transactions</a>
                <a href="loans.html" class="nav-link">Loans</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Overview</h2>
                <div class="user-profile">
                    <span id="welcome-msg">Welcome, User</span>
                    <div class="avatar" id="user-avatar">U</div>
                </div>
            </header>

            <div class="form-group" style="max-width: 300px;">
                <label for="account-select">Select Account</label>
                <select id="account-select" class="form-control"></select>
            </div>

            <div class="stats-grid">
                <div class="glass-panel stat-card balance-card">
                    <div class="stat-label">Available Balance</div>
                    <div class="stat-value" id="current-balance">$0.00</div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="open-deposit">Deposit</button>
                        <button class="btn btn-outline" id="open-withdraw">Withdraw</button>
                    </div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-label">Account Type</div>
                    <div class="stat-value" id="account-type" style="font-size: 1.5rem; margin-top: 0.5rem;">-</div>
                </div>
            </div>

            <div class="glass-panel chart-container">
                <h3 style="margin-bottom: 1rem;">Balance History</h3>
                <canvas id="balanceChart"></canvas>
            </div>

            <div class="glass-panel mt-4">
                <h3>Recent Transactions</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="recent-tx-body">
                            <!-- Transactions injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Deposit Modal -->
    <div class="modal-overlay" id="deposit-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Deposit Funds</h2>
                <button class="close-btn" id="close-deposit">&times;</button>
            </div>
            <form id="deposit-form">
                <div class="form-group">
                    <label for="deposit-amount">Amount ($)</label>
                    <input type="number" id="deposit-amount" class="form-control" min="1" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Deposit</button>
            </form>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal-overlay" id="withdraw-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Withdraw Funds</h2>
                <button class="close-btn" id="close-withdraw">&times;</button>
            </div>
            <form id="withdraw-form">
                <div class="form-group">
                    <label for="withdraw-amount">Amount ($)</label>
                    <input type="number" id="withdraw-amount" class="form-control" min="1" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Withdrawal</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/user-dashboard.js"></script>
</body>
</html>
