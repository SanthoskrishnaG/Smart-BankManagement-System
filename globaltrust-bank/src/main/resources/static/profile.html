<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Profile</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GlobalTrust</div>
            <nav>
                <a href="user-dashboard.html" class="nav-link">Dashboard</a>
                <a href="transactions.html" class="nav-link">Transactions</a>
                <a href="loans.html" class="nav-link">Loans</a>
                <a href="profile.html" class="nav-link active">Profile</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>User Profile</h2>
            </header>

            <div class="glass-panel" style="max-width: 600px;">
                <div class="flex items-center gap-4 mb-4" style="border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
                    <div class="avatar" id="profile-avatar" style="width: 80px; height: 80px; font-size: 2rem;">U</div>
                    <div>
                        <h3 id="profile-name" style="font-size: 1.5rem; margin-bottom: 0.5rem;">User Name</h3>
                        <p class="text-secondary" id="profile-id">ID: U000</p>
                    </div>
                </div>

                <div class="mt-4">
                    <p style="margin-bottom: 1rem;"><strong class="text-secondary">Username:</strong> <span id="profile-username">user123</span></p>
                    <p style="margin-bottom: 1rem;"><strong class="text-secondary">Total Accounts:</strong> <span id="profile-accounts-count">0</span></p>
                    <p style="margin-bottom: 1rem;"><strong class="text-secondary">Total Loans:</strong> <span id="profile-loans-count">0</span></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
