<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Loans</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GlobalTrust</div>
            <nav>
                <a href="user-dashboard.html" class="nav-link">Dashboard</a>
                <a href="transactions.html" class="nav-link">Transactions</a>
                <a href="loans.html" class="nav-link active">Loans</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h2>Loan Management</h2>
                <button class="btn btn-primary" id="open-loan-modal">Apply for Loan</button>
            </div>

            <div class="glass-panel">
                <h3>My Loans</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Loan ID</th>
                                <th>Amount</th>
                                <th>Duration</th>
                                <th>Reason</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="loans-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Apply Loan Modal -->
    <div class="modal-overlay" id="loan-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Apply for Loan</h2>
                <button class="close-btn" id="close-loan-modal">&times;</button>
            </div>
            <form id="loan-form">
                <div class="form-group">
                    <label for="loan-amount">Amount ($)</label>
                    <input type="number" id="loan-amount" class="form-control" min="1000" step="100" required>
                </div>
                <div class="form-group">
                    <label for="loan-duration">Duration</label>
                    <select id="loan-duration" class="form-control" required>
                        <option value="6 months">6 Months</option>
                        <option value="12 months">12 Months</option>
                        <option value="24 months">24 Months</option>
                        <option value="36 months">36 Months</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="loan-reason">Reason</label>
                    <textarea id="loan-reason" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/loans.js"></script>
</body>
</html>
