<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Transactions</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GlobalTrust</div>
            <nav>
                <a href="user-dashboard.html" class="nav-link">Dashboard</a>
                <a href="transactions.html" class="nav-link active">Transactions</a>
                <a href="loans.html" class="nav-link">Loans</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Transaction History</h2>
            </header>

            <div class="glass-panel mb-4">
                <div class="flex gap-4 items-center mb-4">
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <select id="account-filter" class="form-control">
                            <option value="all">All Accounts</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <select id="type-filter" class="form-control">
                            <option value="all">All Types</option>
                            <option value="Deposit">Deposits</option>
                            <option value="Withdrawal">Withdrawals</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Transaction ID</th>
                                <th>Account</th>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="tx-body">
                            <!-- Injected -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>
