<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Secure Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }
        
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
            border: 1px solid var(--card-border);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 3px;
            background-color: var(--text-primary);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #0a1628;
        }

        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s;
        }

        .auth-links a:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="glass-panel login-card">
            <h1 class="logo">GlobalTrust Bank</h1>
            <p class="tagline">Secure. Trusted. Global.</p>

            <div class="toggle-container">
                <span id="role-user">User</span>
                <label class="switch">
                    <input type="checkbox" id="role-toggle">
                    <span class="slider"></span>
                </label>
                <span id="role-admin">Admin</span>
            </div>

            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Secure Login</button>
            </form>

            <div class="auth-links">
                New to GlobalTrust? <a href="#" id="open-register">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="register-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Create Account</h2>
                <button class="close-btn" id="close-register">&times;</button>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="reg_username">Username</label>
                    <input type="text" id="reg_username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="reg_password">Password</label>
                    <input type="password" id="reg_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
