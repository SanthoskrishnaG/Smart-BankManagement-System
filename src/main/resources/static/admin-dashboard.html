<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrust Bank - Admin Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">GlobalTrust Admin</div>
            <nav>
                <a href="admin-dashboard.html" class="nav-link active">Dashboard</a>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Admin Overview</h2>
                <div class="user-profile">
                    <span>Welcome, Admin</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <div class="stats-grid">
                <div class="glass-panel stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="total-users">0</div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-label">Total Bank Balance</div>
                    <div class="stat-value" id="total-balance">$0.00</div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-label">Total Accounts</div>
                    <div class="stat-value" id="total-accounts">0</div>
                </div>
            </div>

            <div class="glass-panel mb-4">
                <div class="flex justify-between items-center mb-4">
                    <h3>User Management</h3>
                    <button class="btn btn-primary" id="open-add-user">Add User</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Accounts</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel">
                <h3>Pending Loan Applications</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Loan ID</th>
                                <th>User ID</th>
                                <th>Amount</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-loans-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="add-user-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h2>Add New User</h2>
                <button class="close-btn" id="close-add-user">&times;</button>
            </div>
            <form id="add-user-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="add-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="add-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="text" id="add-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create User</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/admin-dashboard.js"></script>
</body>
</html>
